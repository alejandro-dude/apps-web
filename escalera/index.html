<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA ESCALERA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e8e8e8; font-family: 'Courier New', monospace; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.3); }
  textarea, input { -webkit-appearance: none; border-radius: 0; }
  ::-webkit-scrollbar { width: 4px; } 
  ::-webkit-scrollbar-track { background: #0d0d0d; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "escalera-tareas-v1";
const loadTareas = () => { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch { return []; } };
const saveTareas = (t) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); } catch {} };
const ahora = () => new Date().toISOString();
const diasRestantes = (d) => Math.ceil((new Date(d) - new Date()) / 86400000);

const ESTADOS = { PENDIENTE:"pendiente", VENCIDA:"vencida", COMPLETADA:"completada", P1:"penitencia_1", P2:"penitencia_2", P3:"penitencia_3", DINERO:"dinero" };

function getEstado(t) {
  if (t.completada) return ESTADOS.COMPLETADA;
  if (t.nivelActual === 4) return ESTADOS.DINERO;
  if (t.nivelActual === 3) return ESTADOS.P3;
  if (t.nivelActual === 2) return ESTADOS.P2;
  if (t.nivelActual === 1) return ESTADOS.P1;
  if (new Date(t.deadline) < new Date()) return ESTADOS.VENCIDA;
  return ESTADOS.PENDIENTE;
}

const COLOR = {
  pendiente:    { bg:"#0d1a0d", border:"#1a3a1a", accent:"#4a9a4a", label:"ACTIVA" },
  vencida:      { bg:"#1a0d0d", border:"#3a1a1a", accent:"#e85a4a", label:"VENCIDA" },
  completada:   { bg:"#0a0a0a", border:"#1a1a1a", accent:"#444",    label:"COMPLETADA" },
  penitencia_1: { bg:"#1a110d", border:"#3a2a1a", accent:"#e8944a", label:"PENITENCIA I" },
  penitencia_2: { bg:"#1a0d15", border:"#3a1a2a", accent:"#e84a8a", label:"PENITENCIA II" },
  penitencia_3: { bg:"#110d1a", border:"#2a1a3a", accent:"#944ae8", label:"PENITENCIA III" },
  dinero:       { bg:"#1a1a0d", border:"#3a3a1a", accent:"#e8c547", label:"⚠ CONSECUENCIA ECONÓMICA" },
};

const inp = (extra={}) => ({ width:"100%", background:"#080808", border:"1px solid #222", color:"#ccc", fontFamily:"'Courier New',monospace", fontSize:"13px", padding:"10px 12px", outline:"none", boxSizing:"border-box", marginTop:"6px", ...extra });
const lbl = { fontSize:"10px", letterSpacing:"2px", color:"#555", display:"block", marginTop:"16px" };
const sec = (color) => ({ borderLeft:`2px solid ${color}`, paddingLeft:"16px", marginTop:"20px" });
const btn = (bg, border, color, extra={}) => ({ padding:"12px", background:bg, border:`1px solid ${border}`, color, fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"2px", cursor:"pointer", ...extra });

function NuevaTareaForm({ onSave, onCancel }) {
  const [f, setF] = useState({ tarea:"", deadline:"", p1:"", d1:"", p2:"", d2:"", p3:"", d3:"", monto:"", dest:"" });
  const s = (k,v) => setF(x => ({...x, [k]:v}));
  const valid = f.tarea && f.deadline && f.p1 && f.d1 && f.p2 && f.d2 && f.p3 && f.d3 && f.monto && f.dest;
  const save = () => { if(!valid) return; onSave({ id:Date.now(), tarea:f.tarea, deadline:f.deadline, penitencias:[{texto:f.p1,deadline:f.d1},{texto:f.p2,deadline:f.d2},{texto:f.p3,deadline:f.d3}], monto:f.monto, destinatario:f.dest, nivelActual:0, completada:false, historial:[], creadaEn:ahora() }); };

  return (
    <div style={{padding:"28px", maxWidth:"600px", margin:"0 auto"}}>
      <div style={{fontSize:"11px",letterSpacing:"3px",color:"#555",marginBottom:"4px"}}>NUEVA TAREA</div>
      <div style={{fontSize:"22px",fontWeight:"900",color:"#fff",marginBottom:"24px"}}>Define el compromiso</div>

      <div style={sec("#4a9a4a")}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:"#4a9a4a"}}>NIVEL 0 — LA TAREA</div>
        <label style={lbl}>¿QUÉ VAS A HACER?</label>
        <textarea value={f.tarea} onChange={e=>s("tarea",e.target.value)} placeholder="Ej: Escribir a Malayerba pidiendo disponibilidad de espacio" style={inp({minHeight:"70px",resize:"vertical"})} />
        <label style={lbl}>DEADLINE</label>
        <input type="date" value={f.deadline} onChange={e=>s("deadline",e.target.value)} style={inp()} />
      </div>

      <div style={sec("#e8944a")}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:"#e8944a"}}>NIVEL 1 — PENITENCIA I (costosa pero útil)</div>
        <label style={lbl}>¿QUÉ HARÁS SI NO CUMPLES?</label>
        <textarea value={f.p1} onChange={e=>s("p1",e.target.value)} placeholder="Ej: Grabar y subir un video ensayo ese mismo día" style={inp({minHeight:"70px",resize:"vertical"})} />
        <label style={lbl}>DEADLINE PARA ESTA PENITENCIA</label>
        <input type="date" value={f.d1} onChange={e=>s("d1",e.target.value)} style={inp()} />
      </div>

      <div style={sec("#e84a8a")}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:"#e84a8a"}}>NIVEL 2 — PENITENCIA II (humillante)</div>
        <label style={lbl}>¿QUÉ HARÁS SI TAMPOCO CUMPLES LA ANTERIOR?</label>
        <textarea value={f.p2} onChange={e=>s("p2",e.target.value)} placeholder="Ej: Escribirle a un interés romántico proponiéndole salir" style={inp({minHeight:"70px",resize:"vertical"})} />
        <label style={lbl}>DEADLINE</label>
        <input type="date" value={f.d2} onChange={e=>s("d2",e.target.value)} style={inp()} />
      </div>

      <div style={sec("#944ae8")}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:"#944ae8"}}>NIVEL 3 — PENITENCIA III (máximo costo social)</div>
        <label style={lbl}>¿Y SI TAMPOCO?</label>
        <textarea value={f.p3} onChange={e=>s("p3",e.target.value)} placeholder="Ej: Video con cara pintada de rojo en lugar público, subido ese día" style={inp({minHeight:"70px",resize:"vertical"})} />
        <label style={lbl}>DEADLINE</label>
        <input type="date" value={f.d3} onChange={e=>s("d3",e.target.value)} style={inp()} />
      </div>

      <div style={sec("#e8c547")}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:"#e8c547"}}>NIVEL 4 — CONSECUENCIA ECONÓMICA (techo final)</div>
        <label style={lbl}>MONTO (USD)</label>
        <input type="number" value={f.monto} onChange={e=>s("monto",e.target.value)} placeholder="Ej: 20" style={inp()} />
        <label style={lbl}>DESTINATARIO (Patreon, amigo, etc.)</label>
        <input type="text" value={f.dest} onChange={e=>s("dest",e.target.value)} placeholder="Ej: Patreon de Joel Haver" style={inp()} />
      </div>

      <div style={{display:"flex",gap:"8px",marginTop:"28px"}}>
        <button onClick={save} disabled={!valid} style={btn(valid?"#1a3a1a":"#111", valid?"#2a6a2a":"#222", valid?"#6aba6a":"#333", {flex:1,padding:"14px",cursor:valid?"pointer":"default"})}>GUARDAR COMPROMISO</button>
        <button onClick={onCancel} style={btn("#0d0d0d","#222","#444",{padding:"14px 20px"})}>CANCELAR</button>
      </div>
    </div>
  );
}

function TareaCard({ tarea, onUpdate }) {
  const [exp, setExp] = useState(false);
  const [shot, setShot] = useState(null);
  const fileRef = useRef();
  const estado = getEstado(tarea);
  const c = COLOR[estado];
  const dias = estado === ESTADOS.PENDIENTE ? diasRestantes(tarea.deadline) : null;

  const avanzar = () => onUpdate({...tarea, nivelActual:tarea.nivelActual+1, historial:[...tarea.historial,{nivel:tarea.nivelActual,fecha:ahora(),accion:"no_cumplido"}]});
  const completar = () => onUpdate({...tarea, completada:true, historial:[...tarea.historial,{nivel:tarea.nivelActual,fecha:ahora(),accion:"completado"}]});

  const textoActual = () => {
    if (estado === ESTADOS.PENDIENTE || estado === ESTADOS.VENCIDA) return tarea.tarea;
    if (estado === ESTADOS.DINERO) return `Transferir $${tarea.monto} a: ${tarea.destinatario}`;
    return tarea.penitencias[tarea.nivelActual-1]?.texto || "";
  };

  const niveles = ["TAREA","PENITENCIA I","PENITENCIA II","PENITENCIA III","DINERO"];

  return (
    <div style={{border:`1px solid ${c.border}`,background:c.bg,marginBottom:"2px",transition:"all 0.3s"}}>
      <div style={{padding:"20px 24px",cursor:"pointer"}} onClick={()=>setExp(e=>!e)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:c.accent,marginBottom:"8px"}}>{c.label}</div>
          {dias !== null && <div style={{fontSize:"11px",color:dias<=1?"#e85a4a":"#555"}}>{dias<=0?"HOY":`${dias}d`}</div>}
        </div>
        <div style={{fontSize:"14px",color:estado===ESTADOS.COMPLETADA?"#333":"#bbb",lineHeight:"1.5",textDecoration:estado===ESTADOS.COMPLETADA?"line-through":"none"}}>{tarea.tarea}</div>
        {estado!==ESTADOS.PENDIENTE && estado!==ESTADOS.COMPLETADA && (
          <div style={{marginTop:"10px",fontSize:"12px",color:c.accent,borderLeft:`2px solid ${c.accent}`,paddingLeft:"10px"}}>{textoActual()}</div>
        )}
      </div>

      {exp && estado!==ESTADOS.COMPLETADA && (
        <div style={{borderTop:`1px solid ${c.border}`,padding:"20px 24px"}}>
          <div style={{marginBottom:"20px"}}>
            {niveles.map((label,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"6px",opacity:tarea.nivelActual===i?1:tarea.nivelActual>i?0.3:0.5}}>
                <div style={{width:"8px",height:"8px",borderRadius:"50%",background:tarea.nivelActual===i?c.accent:"#1a1a1a",border:`1px solid ${tarea.nivelActual===i?c.accent:"#333"}`,flexShrink:0}} />
                <div style={{fontSize:"10px",letterSpacing:"1px",color:tarea.nivelActual===i?c.accent:"#333"}}>
                  {label}
                  {i>0&&i<=3&&tarea.penitencias[i-1]&&<span style={{color:"#2a2a2a",marginLeft:"8px"}}>— {tarea.penitencias[i-1].texto.substring(0,40)}{tarea.penitencias[i-1].texto.length>40?"...":""}</span>}
                  {i===4&&<span style={{color:"#2a2a2a",marginLeft:"8px"}}>— ${tarea.monto} → {tarea.destinatario}</span>}
                </div>
              </div>
            ))}
          </div>

          {(estado===ESTADOS.VENCIDA && tarea.nivelActual===0) ? (
            <div>
              <div style={{fontSize:"12px",color:"#e85a4a",marginBottom:"16px",lineHeight:"1.6"}}>
                El deadline venció. ¿Lo hiciste igual o pasas a la penitencia?
              </div>
              <div style={{display:"flex",gap:"8px"}}>
                <button onClick={completar} style={btn("#1a3a1a","#2a5a2a","#6aba6a",{flex:1})}>LO HICE</button>
                <button onClick={avanzar} style={btn("#2a1a1a","#4a2a2a","#8a4a4a",{flex:1})}>NO LO HICE</button>
              </div>
            </div>
          ) : estado===ESTADOS.DINERO ? (
            <div>
              <div style={{fontSize:"12px",color:"#e8c547",marginBottom:"16px",lineHeight:"1.6"}}>
                Transferir <strong>${tarea.monto}</strong> a <strong>{tarea.destinatario}</strong>.<br/>Sube el screenshot de la transferencia para cerrar este compromiso.
              </div>
              <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>setShot(e.target.files[0]?URL.createObjectURL(e.target.files[0]):null)} />
              {!shot
                ? <button onClick={()=>fileRef.current.click()} style={btn("#1a1a0d","#3a3a1a","#e8c547",{width:"100%"})}>SUBIR SCREENSHOT</button>
                : <div>
                    <img src={shot} alt="proof" style={{width:"100%",marginBottom:"12px",border:"1px solid #3a3a1a"}} />
                    <button onClick={completar} style={btn("#1a3a1a","#2a6a2a","#6aba6a",{width:"100%"})}>CONFIRMAR — COMPROMISO CERRADO</button>
                  </div>
              }
            </div>
          ) : (
            <div style={{display:"flex",gap:"8px"}}>
              <button onClick={completar} style={btn("#1a3a1a","#2a5a2a","#6aba6a",{flex:1})}>{tarea.nivelActual===0?"TAREA CUMPLIDA":"PENITENCIA CUMPLIDA"}</button>
              <button onClick={avanzar} style={btn("#2a1a1a","#4a2a2a","#8a4a4a",{flex:1})}>{tarea.nivelActual===0?"NO LO HICE":"TAMPOCO ESTO"}</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tareas, setTareas] = useState([]);
  const [vista, setVista] = useState("lista");
  const importarRef = useRef();

  useEffect(()=>{ setTareas(loadTareas()); },[]);

  const agregar = (t) => { const n=[t,...tareas]; setTareas(n); saveTareas(n); setVista("lista"); };
  const actualizar = (a) => { const n=tareas.map(t=>t.id===a.id?a:t); setTareas(n); saveTareas(n); };

  const exportar = () => {
    const blob = new Blob([JSON.stringify(tareas,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=`escalera-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const importar = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = (ev) => { try { const d=JSON.parse(ev.target.result); if(Array.isArray(d)){setTareas(d);saveTareas(d);} } catch {} };
    r.readAsText(file); e.target.value="";
  };

  const pendientes = tareas.filter(t=>!t.completada);
  const completadas = tareas.filter(t=>t.completada);

  if (vista==="nueva") return (
    <div style={{minHeight:"100vh",background:"#0d0d0d",fontFamily:"'Courier New',monospace",color:"#e8e8e8"}}>
      <NuevaTareaForm onSave={agregar} onCancel={()=>setVista("lista")} />
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#0d0d0d",fontFamily:"'Courier New',monospace",color:"#e8e8e8"}}>
      <div style={{borderBottom:"1px solid #1a1a1a",padding:"28px 28px 20px"}}>
        <div style={{fontSize:"10px",letterSpacing:"4px",color:"#444",marginBottom:"6px"}}>SISTEMA DE CONSECUENCIAS</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:"12px"}}>
          <h1 style={{fontSize:"clamp(24px,4vw,36px)",fontWeight:"900",margin:0,letterSpacing:"-1px"}}>
            LA<br/><span style={{color:"#e8c547"}}>ESCALERA.</span>
          </h1>
          <div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
            <input ref={importarRef} type="file" accept=".json" style={{display:"none"}} onChange={importar} />
            <button onClick={()=>importarRef.current.click()} style={btn("#0d0d0d","#222","#555",{padding:"10px 14px",fontSize:"10px"})}>IMPORTAR</button>
            <button onClick={exportar} disabled={tareas.length===0} style={btn("#0d0d0d","#222",tareas.length>0?"#555":"#222",{padding:"10px 14px",fontSize:"10px",cursor:tareas.length>0?"pointer":"default"})}>EXPORTAR</button>
            <button onClick={()=>setVista("nueva")} style={btn("#1a3a1a","#2a5a2a","#6aba6a",{padding:"10px 18px"})}>+ NUEVO</button>
          </div>
        </div>
        <div style={{fontSize:"11px",color:"#333",marginTop:"12px"}}>{pendientes.length} ACTIVAS · {completadas.length} CERRADAS</div>
      </div>

      <div style={{padding:"20px 28px",maxWidth:"680px"}}>
        {tareas.length===0 && (
          <div style={{padding:"48px 0",textAlign:"center",color:"#333",fontSize:"13px",lineHeight:"2"}}>
            No hay compromisos activos.<br/>
            <span style={{color:"#555"}}>Eso puede ser cobardía o puede ser paz.<br/>Solo tú sabes cuál.</span>
          </div>
        )}
        {pendientes.map(t=><TareaCard key={t.id} tarea={t} onUpdate={actualizar} />)}
        {completadas.length>0 && <>
          <div style={{fontSize:"10px",letterSpacing:"3px",color:"#2a2a2a",margin:"28px 0 12px"}}>CERRADAS</div>
          {completadas.map(t=><TareaCard key={t.id} tarea={t} onUpdate={actualizar} />)}
        </>}
        <div style={{marginTop:"40px",padding:"20px",border:"1px solid #111",fontSize:"11px",color:"#2a2a2a",lineHeight:"2",letterSpacing:"0.5px"}}>
          El sistema no te juzga.<br/>
          Solo registra lo que haces y lo que evitas.<br/>
          La escalera sube sola si no actúas.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
